<!DOCTYPE html>
<html>
<head>
<title> Sistema de Entrenamiento Stark</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle, #0f172a, #020617 70%);
    overflow-x: hidden;
    color: #7dd3fc;
    text-align: center;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    text-shadow: 0 0 15px #00f7ff;
}

.linea {
    width: 250px;
    height: 3px;
    margin: auto;
    margin-top: 10px;
    margin-bottom: 20px;
    background: linear-gradient(
        to right,
        transparent,
        #7dd3fc,
        #c084fc,
        transparent
    );
    border-radius: 10px;
    box-shadow: 0 0 15px #7dd3fc;
}

.box {
    position: relative;
    overflow: hidden;
    margin: 40px auto;
    padding: 20px;
    width: 350px;
    border: 1px solid rgba(125, 211, 252, 0.5);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    box-shadow: 0 0 20px rgba(125, 211, 252, 0.4),
                0 0 20px rgba(192, 132, 252, 0.2);
    background: rgba(15,23,42,0.7);
}

.box::before {
    content: "";
    position: absolute;
    top: -150%;
    left: -50%;
    width: 200%;
    height: 300%;
    background: linear-gradient(
        transparent,
        rgba(255, 255, 255, 0.04),
        transparent
    );
    transform: rotate(25deg);
    animation: scan 7s linear infinite;
}

@keyframes scan {
    from {
        transform: 
            translateY(-100%);
            rotate: (25deg);
    }
    to {
        transform: 
            translateY(100%);
            rotate: (25deg);
    }
}

input, select {
    margin: 10px;
    padding: 8px;
    width: 80%;
    background: black;
    border: 1px solid #00f7ff;
    color: #00f7ff;
    font-size: 18px;
    border-radius: 12px;
    transition: 0.3s ease;
}

input:focus,
select:focus {
    outline: none;
    box-shadow: 
    0 0 15px #7dd3fc,
    0 0 25px #c084fc;
    border: 1px solid #c084fc;
}

button {
    background: linear-gradient(135deg, #7dd3fc, #c084fc);
    color: white;
    padding: 12px 25px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(125, 211, 252, 0.5);
}

button:hover {
    transform: scale(1.05);
    box-shadow:  0 0 30px rgba(192,132,252,0.8);
}

#resultado {
    font-size: 20px;
    margin-top: 15px;
    animation: pulse 1s infinite alternate;
    color: #7dd3fc;
    font-weight: bold;
}

@keyframes pulse {
    from { transform: scale(1);
        text-shadow: 
         0 0 10px #7dd3fc,
         0 0 20px #7dd3fc;
     }
    to { 
        transform: scale(1.05);
        text-shadow: 
        0 0 20px #c084fc,
        0 0 40px #7dd3fc;
     }
}

#jarvis {
    margin-top: 10px;
    font-style: italic;
    color: #00ff9c;
}

canvas{
    margin-top:5px;
    border:1px solid #00f7ff;
    border-radius:10px;
    background:#031224;
}

.energia {
    width: 250px;
    height: 10px;
    margin: auto;
    margin-top: 15px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
    box-shadow: 0 0 10px rgba(125, 211, 252, 0.3);
}

.carga {
    width: 70%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        #7dd3fc,
        #c084fc
    );
    box-shadow: 
        0 0 15px #7dd3fc,
        0 0 30px #c084fc;
    animation: energia 3s ease-in-out infinite alternate;
}

@keyframes energia {
    from {
        width: 45%;
    }
    to {
        width: 90%;
    }
}

.stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(circle, rgba(125, 211, 252, 0.8) 1px, transparent 2px),
        radial-gradient(circle, rgba(192, 132, 252, 0.6) 2px, transparent 2px),
        radial-gradient(circle, rgba(255, 255, 255, 0.7) 1.5px, transparent 2px);
    background-size: 
        120px 120px,
        200px 200px,
        160px 160px;
    background-position: 
        0 0,
        40px 60px,
        100px 30px;
    animation: moveStars 40s ease-in-out infinite;
    opacity: 0.5;
    z-index: -1;
}
@keyframes moveStars {
    0% {
        transform: translate(0, 0);
    }

    25% {
        transform: translate(-10px, -15px);
    }

    50% {
        transform: translate(5px, -25px);
    }

    75% {
        transform: translate(-5px, -10px);
    }

    100% {
        transform: translate(0, 0);
    }
}

#simulacion {
    margin-top: 25px;
    min-height: 120px;
    border-top: 1px solid rgba(125, 211, 252, 0.2);
    padding-top: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.bloque {
    width: 50px;
    height: 50px;
    background: linear-gradient(
        135deg,
        #7dd3fc,
        #c084fc
    );
    border-radius: 12px;
    position: relative;
    box-shadow: 
        0 0 15px #7dd3fc
        0 0 30px #c084fc;
}

.flecha {
    position: relative;
    font-size: 35px;
    color: #7dd3fc;
    text-shadow: 0 0 10px #7dd3fc;
}

@keyframes moverBloque {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(150px);
    }
}

</style>
</head>

<body>

<div class="stars"></div>

<h1>DANI PHYSICS CORE</h1>
<div class="linea"></div>
<p>Centro de Simulacion de Fisica • Protocolo Dani v2.6</p>

<div class="energia">
    <div class="carga"></div>
</div>

<div class="box">

<select id="tipo" onchange="mostrarCampos()">
    <option value="">--Selecciona misión--</option>
    <option value="1">Sin fricción</option>
    <option value="2">Con fricción</option>
    <option value="3">Polea</option>
    <option value="4">3 masas</option>
    <option value="5">Fuerza con ángulo</option>
    <option value="6">3ra Ley de Newton</option>
</select>

<div id="campos"></div>

<button id="btnCalcular" onclick="resolver()">Ejecutar Calculo</button>

<h3 id="resultado"></h3>
<p id="procedimiento"></p>
<div id="panel"></div>
<div id="simulacion"></div>
<h3 style="margin-top:10px;">Visualización Física</h3>
<canvas id="lienzo" width="400" height="180"></canvas>
<p id="jarvis"></p>

</div>

<script>

function hablar(msg) {
    document.getElementById("jarvis").innerText = "🟣 JARVIS: " + msg;
}

function mostrarCampos() {
    let tipo = document.getElementById("tipo").value;
    let campos = document.getElementById("campos");

    hablar("Nivel de estrés académico: preocupante.");

    if (tipo == "1") {
        campos.innerHTML = `
        <input id="m1" placeholder="Masa">
        <input id="F" placeholder="Fuerza">
        `;
    }

    else if (tipo == "2") {
        campos.innerHTML = `
        <input id="m1" placeholder="Masa">
        <input id="F" placeholder="Fuerza">
        <input id="mu" placeholder="Coeficiente fricción">
        `;
    }

    else if (tipo == "3") {
        campos.innerHTML = `
        <input id="m1" placeholder="Masa 1">
        <input id="m2" placeholder="Masa 2">
        `;
    }

    else if (tipo == "4") {
        campos.innerHTML = `
        <input id="m1" placeholder="Masa 1">
        <input id="m2" placeholder="Masa 2">
        <input id="m3" placeholder="Masa 3">
        `;
    }

    else if (tipo == "5") {
        campos.innerHTML = `
        <input id="m1" placeholder="Masa">
        <input id="F" placeholder="Fuerza">
        <input id="angulo" placeholder="Ángulo">
        `;
    }

    else if (tipo == "6") {
    campos.innerHTML = `
    <input type="number" id="F" placeholder="Fuerza aplicada (N)">
    `;
    }

    else {
        campos.innerHTML = "";
    }
}

function resolver() {
    
    document.getElementById("clickSound").play();
    let tipo = document.getElementById("tipo").value;
    let g = 9.8;
    let resultado = "";
    let procedimiento = "";
    let boton = document.getElementById("btnCalcular");
    boton.innerText = "Analizando...";
    boton.disabled = true;

    hablar("Analizando variables...");
    setTimeout(() => {

    if (tipo == "1") {
        let m = parseFloat(document.getElementById("m1").value);
        let F = parseFloat(document.getElementById("F").value);

        let a = F / m;

        resultado = "Aceleración: " + a.toFixed(2);
        document.getElementById("panel").innerHTML = `
        <div class="bloque"></div>

        <div class="flecha">→</div>
        🧾 Datos del sistema:<br>
        • Masa: ${m}<br>
        • Fuerza: ${F}<br>
        • Tipo: Sin fricción
`;  
        document.querySelector(".bloque").style.animation =
        "moverBloque 2s ease forwards";
        procedimiento = "F = m·a";
        hablar("Movimiento limpio detectado.");
    }

    else if (tipo == "2") {
        let m = parseFloat(document.getElementById("m1").value);
        let F = parseFloat(document.getElementById("F").value);
        let mu = parseFloat(document.getElementById("mu").value);

        let fr = mu * m * g;
        let a = (F - fr) / m;

        resultado = "Aceleración: " + a.toFixed(2);
        document.getElementById("panel").innerHTML = `
        <div class="bloque"></div>

        <div class="flecha">→</div>
        🧾 Datos del sistema:<br>
        • Masa: ${m}<br>
        • Fuerza: ${F}<br>
        • μ: ${mu}<br>
        • Fricción calculada: ${fr.toFixed(2)}
`;
        document.querySelector(".bloque").style.animation =
        "moverBloque 2s ease forwards";
        procedimiento = "Fricción = μ·m·g → F - fricción = m·a";
        hablar("Fricción considerada Ajustando calculo dinamico...");
    }

    else if (tipo == "3") {
        let m1 = parseFloat(document.getElementById("m1").value);
        let m2 = parseFloat(document.getElementById("m2").value);

        let a = (m2 - m1) * g / (m1 + m2);

        resultado = "Aceleración: " + a.toFixed(2);
        document.getElementById("panel").innerHTML = `
        <div class="bloque"></div>

        <div class="flecha">→</div>
        🧾 Sistema de poleas:<br>
        • m1: ${m1}<br>
        • m2: ${m2}
`;
        document.querySelector(".bloque").style.animation =
        "moverBloque 2s ease forwards";
        procedimiento = "Sistema de polea";
        hablar("Sistema de poleas estabilizado.");
    }

    else if (tipo == "4") {
        let m1 = parseFloat(document.getElementById("m1").value);
        let m2 = parseFloat(document.getElementById("m2").value);
        let m3 = parseFloat(document.getElementById("m3").value);

        let a = (m3 - m1) * g / (m1 + m2 + m3);

        resultado = "Aceleración: " + a.toFixed(2);
        document.getElementById("panel").innerHTML = `
        <div class="bloque"></div>

        <div class="flecha">→</div>
        🧾 Sistema 3 masas:<br>
        • m1: ${m1}<br>
        • m2: ${m2}<br>
        • m3: ${m3}
`;
        document.querySelector(".bloque").style.animation =
        "moverBloque 2s ease forwards";
        procedimiento = "Sistema de 3 masas";
        hablar("Resolviendo dinamica avanzada");
    }

    else if (tipo == "5") {
        let m = parseFloat(document.getElementById("m1").value);
        let F = parseFloat(document.getElementById("F").value);
        let ang = parseFloat(document.getElementById("angulo").value);

        let rad = ang * Math.PI / 180;
        let Fx = F * Math.cos(rad);
        let a = Fx / m;

        resultado = "Aceleración: " + a.toFixed(2);
        document.getElementById("panel").innerHTML = `
        <div class="bloque"></div>

        <div class="flecha">→</div>
        🧾 Fuerza angular:<br>
        • Masa: ${m}<br>
        • Fuerza: ${F}<br>
        • Ángulo: ${ang}°
`;
        document.querySelector(".bloque").style.animation =
        "moverBloque 2s ease forwards";
        procedimiento = "Fx = F·cos(θ)";
        hablar("Descomponiendo vectores.");
    }

    else if (tipo == "6") {
        let F = parseFloat(document.getElementById("F").value);
        resultado = "Fuerza de reacción: " + (-F).toFixed(2) + " N";
        procedimiento = "Toda acción genera una reacción igual y opuesta.";
        hablar("Tercera ley aplicada.");
        dibujarTerceraLey(F);
    }

    document.getElementById("resultado").innerText = resultado;
    document.getElementById("procedimiento").innerText = procedimiento;

     boton.innerText = "Ejecutar Calculo";
        boton.disabled = false;
    }, 1200);
}

function dibujarTerceraLey(F) {

    let c = document.getElementById("lienzo");
    let ctx = c.getContext("2d");

    ctx.clearRect(0, 0, c.width, c.height);

    ctx.strokeStyle = "#00f7ff";
    ctx.fillStyle = "#00f7ff";
    ctx.lineWidth = 3;
    ctx.font = "18px Arial";

    // Suelo
    ctx.beginPath();
    ctx.moveTo(380,120);
    ctx.lineTo(380,115);
    ctx.stroke();

    // Bloque 1
    ctx.strokeRect(50,55,70,50);

    // Bloque 2
    ctx.strokeRect(260,55,70,50);

    // Fuerza 1 →
    ctx.beginPath();
    ctx.moveTo(120,80);
    ctx.lineTo(180,80);
    ctx.stroke();

    ctx.fillText("F₁ = " + F + " N", 70, 145);

    // Punta flecha →
    ctx.beginPath();
    ctx.moveTo(180,80);
    ctx.lineTo(170,75);
    ctx.lineTo(170,85);
    ctx.fill();

    // Fuerza 2 ←
    ctx.beginPath();
    ctx.moveTo(260,80);
    ctx.lineTo(200,80);
    ctx.stroke();

    ctx.fillText("F₂ = -" + F + " N", 220, 145);

    // Punta flecha ←
    ctx.beginPath();
    ctx.moveTo(200,80);
    ctx.lineTo(210,75);
    ctx.lineTo(210,85);
    ctx.fill();

    // Aceleración 1 →
    ctx.fillStyle = "#ff4dff";

    ctx.beginPath();
    ctx.moveTo(80,70);
    ctx.lineTo(130,70);
    ctx.stroke();

    ctx.fillText("a₁", 135,75);

    // Aceleración 2 ←
    ctx.beginPath();
    ctx.moveTo(300,70);
    ctx.lineTo(250,70);
    ctx.stroke();

    ctx.fillText("a₂", 220,75);

    // Valores aceleración
    ctx.fillText("a₁ = 6.2 m/s²", 50,165);
    ctx.fillText("a₂ = -6.2 m/s²", 210,165);
}

</script>

<audio id="clickSound" src="click.mp3"></audio>

</body>
</html>
